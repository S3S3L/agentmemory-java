server:
  port: 40080

spring:
  application:
    name: agentmemory

agentmemory:
  embedding: ollama
  rerank: rest

# Elasticsearch
elasticsearch:
  host: localhost
  port: 9200
  scheme: http

# DashScope
dashscope:
  api-key: ${DASHSCOPE_API_KEY:}
  embedding:
    model: text-embedding-v4
    dimensions: 1024
  rerank:
    model: gte-rerank

# Memory
memory:
  token-budget: 2000
  dedup-window-minutes: 5
  rrf-k: 60
  max-results-per-session: 3
  top-k-bm25: 20
  top-k-vector: 20
  top-k-final: 10
  # Rerank scores are negative; results below this threshold are discarded as low-relevance noise.
  # Closer to 0 = more relevant. Default -5.0 filters out clearly irrelevant results.
  min-rerank-score: -5.0
  # Maximum characters passed to the embedding model (head+tail truncation applied if exceeded).
  # nomic-embed-text supports 8192 tokens → ~24000 chars.
  # For mxbai-embed-large (512 tokens) use 3000.
  max-embed-chars: 24000
  consolidation:
    enabled: true
    cron: "0 0 */6 * * *"
    promotion:
      working-to-episodic-days: 1
      working-to-episodic-access-count: 3
      episodic-to-semantic-days: 7
      episodic-to-semantic-access-count: 3
      semantic-to-procedural-access-count: 10
  decay:
    enabled: true
    cron: "0 0 2 * * *"
    soft-delete: true
    stale-episodic-days: 30
    stale-semantic-days: 90

# Ollama
ollama:
  endpoint: http://localhost:11434
  embeddingModel: nomic-embed-text
  dimensions: 768

# Rest
rest: 
  rerank:
    endpoint: http://localhost:8000/rerank
