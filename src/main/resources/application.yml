server:
  port: 40080

spring:
  application:
    name: agentmemory

agentmemory:
  embedding: ollama
  rerank: rest

# Elasticsearch
elasticsearch:
  host: localhost
  port: 9200
  scheme: http

# DashScope
dashscope:
  api-key: ${DASHSCOPE_API_KEY:}
  embedding:
    model: text-embedding-v4
    dimensions: 1024
  rerank:
    model: gte-rerank

# Memory
memory:
  token-budget: 2000
  dedup-window-minutes: 5
  rrf-k: 60
  max-results-per-session: 3
  top-k-bm25: 20
  top-k-vector: 20
  top-k-final: 10
  # Rerank scores are negative; results below this threshold are discarded as low-relevance noise.
  # Closer to 0 = more relevant. Default -5.0 filters out clearly irrelevant results.
  min-rerank-score: -5.0
  # Maximum characters passed to the embedding model (head+tail truncation applied if exceeded).
  # Default 3000 is conservative for mxbai-embed-large (512 tokens). Increase for larger-context models:
  # nomic-embed-text (8192 tokens) → ~24000; text-embedding-v4 (8192 tokens) → ~24000.
  max-embed-chars: 3000
  consolidation:
    enabled: true
    cron: "0 0 */6 * * *"
  decay:
    enabled: true
    cron: "0 0 2 * * *"

# Ollama
ollama:
  endpoint: http://localhost:11434
  embeddingModel: mxbai-embed-large
  dimensions: 1024

# Rest
rest: 
  rerank:
    endpoint: http://localhost:8000/rerank