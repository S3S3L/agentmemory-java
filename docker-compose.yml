services:
  elasticsearch:
    image: elasticsearch:8.15.2
    container_name: agentmemory-es
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
    ports:
      - "9200:9200"
    volumes:
      - es-data:/usr/share/elasticsearch/data
    networks:
      - agentmemory-net

  kibana:
    image: kibana:8.15.2
    container_name: agentmemory-kibana
    ports:
      - "5601:5601"
    environment:
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
    depends_on:
      - elasticsearch
    networks:
      - agentmemory-net

volumes:
  es-data:
    driver: local

networks:
  agentmemory-net:
    driver: bridge
